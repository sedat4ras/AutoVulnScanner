name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          ignore: DL3008

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: shieldscan:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/shieldscan.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: shieldscan-image
          path: /tmp/shieldscan.tar
          retention-days: 1

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: shieldscan-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/shieldscan.tar

      - name: Verify tools inside image
        run: |
          docker run --rm --entrypoint /bin/sh shieldscan:ci -c '
            set -eux
            id
            python --version
            semgrep --version
            trivy --version
            gitleaks version
          '

      - name: Prepare scan fixture
        run: |
          mkdir -p /tmp/scan
          cp -r src main.py requirements.txt /tmp/scan/
          sudo chown -R 10001:10001 /tmp/scan

      - name: Run end-to-end scan
        run: |
          docker run --rm -v /tmp/scan:/work shieldscan:ci /work

      - name: Verify reports were written
        run: |
          test -f /tmp/scan/security_report_*.md
          test -f /tmp/scan/findings_*.json
          echo "OK: reports produced"
