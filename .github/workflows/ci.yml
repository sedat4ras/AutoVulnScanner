name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          ignore: DL3008

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: shieldscan:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/shieldscan.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: shieldscan-image
          path: /tmp/shieldscan.tar
          retention-days: 1

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: shieldscan-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/shieldscan.tar

      - name: Verify tools inside image
        run: |
          docker run --rm --entrypoint /bin/sh shieldscan:ci -c '
            set -eux
            id
            python --version
            semgrep --version
            trivy --version
            gitleaks version
          '

      - name: Prepare vulnerable fixture
        run: |
          mkdir -p /tmp/scan
          # Token values are generated at runtime so no literal credential
          # pattern is ever stored in this repository.
          {
            printf 'AWS_ACCESS_KEY_ID = "AKIA%s"\n' "$(tr -dc 'A-Z0-9' </dev/urandom | head -c 16)"
            printf 'GITHUB_TOKEN = "ghp_%s"\n' "$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 36)"
          } > /tmp/scan/config.py
          cat > /tmp/scan/app.py <<'PY'
          import os
          import sqlite3

          from flask import Flask, request

          app = Flask(__name__)


          @app.route("/user")
          def get_user():
              name = request.args.get("name")
              cursor = sqlite3.connect("app.db").cursor()
              cursor.execute("SELECT * FROM users WHERE name = '%s'" % name)
              return str(cursor.fetchall())


          @app.route("/ping")
          def ping():
              os.system("ping -c 1 " + request.args.get("host"))
              return "ok"
          PY
          printf 'Django==2.2.0\nFlask==0.12.2\nPyYAML==5.1\n' > /tmp/scan/requirements.txt
          sudo chown -R 10001:10001 /tmp/scan

      - name: Run end-to-end scan
        run: |
          docker run --rm -v /tmp/scan:/work shieldscan:ci /work

      - name: Verify every scanner produced findings
        run: |
          test -f /tmp/scan/security_report_*.md
          python - "$(ls /tmp/scan/findings_*.json)" <<'PY'
          import json
          import sys

          findings = json.load(open(sys.argv[1]))
          for leg in ("sast", "sca", "secrets"):
              count = len(findings.get(leg, []))
              print(f"{leg}: {count} findings")
              if count == 0:
                  sys.exit(f"FAIL: {leg} scanner reported nothing on a deliberately vulnerable fixture")
          print("OK: all three scanners produced findings")
          PY
