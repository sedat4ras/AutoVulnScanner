name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Semgrep
        run: |
          python -m pip install semgrep

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl

          # Trivy
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add - || true
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy || wget -q https://github.com/aquasecurity/trivy/releases/download/v0.48.0/trivy_0.48.0_Linux-64bit.tar.gz && tar zxf trivy_0.48.0_Linux-64bit.tar.gz && sudo mv trivy /usr/local/bin/

          # Gitleaks
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.0/gitleaks-linux-x64 -O /tmp/gitleaks
          chmod +x /tmp/gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Verify tools
        run: |
          echo "=== Tool versions ==="
          semgrep --version || echo "⚠️  Semgrep not found"
          trivy --version || echo "⚠️  Trivy not found"
          gitleaks --version || echo "⚠️  Gitleaks not found"

      - name: Run security scan
        run: |
          python main.py . 2>&1 || echo "Warning: Scan encountered issues but generating fallback report"
        env:
          PYTHONUNBUFFERED: 1

      - name: Upload reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: |
            security_report_*.md
            findings_*.json

      - name: Post report to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const reports = fs.readdirSync('.').filter(f => f.startsWith('security_report_'));
            if (reports.length > 0) {
              const report = fs.readFileSync(reports[0], 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '## 🔒 Security Scan Results\n' + report
              });
            }
